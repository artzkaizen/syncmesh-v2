name: nightly
# The proof runs that are too long for every push: the chaos soak over many seeds and every
# schedule switch, and the scale-tenant ladder up to ten million rows on SQLite, PGlite and a real
# Postgres. Every step writes its results whether it passes or not; a failure here is a finding,
# and the artifacts are the numbers to read it by.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      rows:
        description: "scale-tenant sizes, space-separated"
        default: "100000 1000000 10000000"
      budget-minutes:
        description: "per-size wall-clock budget for scale-tenant"
        default: "100"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  chaos-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bunx vp run -r build
      - name: soak
        run: bun run --cwd chaos soak -- --seeds 1..30 --switches none,grants,blobs,retention --devices 6 --ticks 25 --timeout 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-soak
          path: chaos/.chaos/
          retention-days: 14

  scale-tenant:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, pglite, postgres]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: syncmesh
          POSTGRES_DB: tenant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SYNCMESH_PG_URL: postgres://postgres:syncmesh@localhost:5432/tenant
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bunx vp run -r build
      - name: ladder
        # each size runs on its own so one that dies (the budget, the OOM killer) still leaves the
        # ones before it; the step fails at the end if any size did
        run: |
          failed=0
          for rows in ${{ github.event.inputs.rows || '100000 1000000 10000000' }}; do
            bun run --cwd bench scale-tenant -- --rows "$rows" --backend ${{ matrix.backend }} \
              --budget-minutes ${{ github.event.inputs.budget-minutes || '100' }} || failed=1
          done
          cat bench/.bench/*.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $failed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scale-tenant-${{ matrix.backend }}
          path: bench/.bench/
          retention-days: 30
