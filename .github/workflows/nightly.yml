name: nightly
# The proof runs that are too long for every push: the chaos soak over many seeds and every
# schedule switch, and the scale-tenant ladder up to ten million rows on SQLite, PGlite and a real
# Postgres. Every step writes its results whether it passes or not; a failure here is a finding,
# and the artifacts are the numbers to read it by.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      rows:
        description: "scale-tenant sizes, comma-separated; each runs as its own job"
        default: "100000,1000000,10000000"
      budget-minutes:
        description: "per-size wall-clock budget for the scale-tenant fold"
        default: "80"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  chaos-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bunx vp run -r build
      - name: timing-bound chaos cases
        run: bun test
        working-directory: chaos
        env:
          SYNCMESH_CHAOS_TIMING: "1"
      - name: soak
        if: always()
        run: bun run --cwd chaos soak -- --seeds 1..30 --switches none,grants,blobs,retention --devices 6 --ticks 25 --timeout 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-soak
          path: chaos/.chaos/
          retention-days: 14

  scale-tenant:
    runs-on: ubuntu-latest
    # one rung per job: a runner is stopped at about 110 minutes, and the ten-million rung needs
    # all of one (gaps O17)
    timeout-minutes: 115
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, pglite, postgres]
        rows: ${{ fromJSON(format('[{0}]', github.event.inputs.rows || '100000,1000000,10000000')) }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: syncmesh
          POSTGRES_DB: tenant
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SYNCMESH_PG_URL: postgres://postgres:syncmesh@localhost:5432/tenant
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bunx vp run -r build
      - name: runner
        run: |
          nproc
          free -m
          df -h / /tmp
      - name: rung
        run: |
          bun run --cwd bench scale-tenant -- --rows ${{ matrix.rows }} --backend ${{ matrix.backend }} \
            --budget-minutes ${{ github.event.inputs.budget-minutes || '80' }}
      - name: summary
        if: always()
        run: |
          cat bench/.bench/*.md >> "$GITHUB_STEP_SUMMARY" || true
          free -m
          df -h / /tmp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scale-tenant-${{ matrix.backend }}-${{ matrix.rows }}
          path: bench/.bench/
          retention-days: 30
