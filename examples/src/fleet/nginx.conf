upstream syncmesh_relays {
  # round robin on purpose: two phones in the same room land on different instances, which is
  # the only interesting case. Sticky sessions would hide whether the fan-out works at all.
  server relay-1:5198;
  server relay-2:5198;
  server relay-3:5198;
}

server {
  listen 5198;

  location / {
    proxy_pass http://syncmesh_relays;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # a syncmesh room is quiet between writes and keeps its sockets open across them; the relay's
    # own keepalive frames are what hold this open, so the timeout only has to outlast them
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
